.market-strip{margin-bottom:26px}.market-sub{color:var(--mint);font-size:10px;margin-top:8px}.market-link{display:inline-block;font-size:10px;margin-top:6px}.market-explainer strong{font-size:20px}@media(max-width:850px){.market-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Evidence scorecards — numbers are editorial ratings, not probabilities. */
.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.score-tile{background:#101b2b;border:1px solid #2b394b;border-radius:9px;padding:10px 11px;min-width:0}
.score-tile .score-top{display:flex;justify-content:space-between;gap:9px;align-items:baseline;font-size:11px;color:var(--sub)}
.score-tile .score-num{color:#e9eff6;font-size:18px;font-weight:700;white-space:nowrap}
.score-tile .score-track{height:5px;border-radius:9px;background:#26374b;overflow:hidden;margin:7px 0}
.score-tile .score-fill{height:5px;background:var(--mint);border-radius:9px}
.score-tile .score-why{font-size:10px;line-height:1.55;color:#a8b5c7}
.score-wrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0;padding:15px 0}
.score-explainer{color:var(--sub);font-size:11px;line-height:1.7}
.score-impact{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 7px}
.score-impact .mini-tag{font-size:11px}
.score-pill{display:inline-block;border-radius:7px;border:1px solid #385064;color:#b9d0de;padding:3px 8px;font-size:10px}
.score-pill.ai{color:var(--mint);border-color:rgba(102,221,187,.5)}
.score-pill.manual{color:var(--amber);border-color:rgba(240,186,114,.5)}
.score-reminder{font-size:10px;color:#8293a8;margin:8px 0 0;line-height:1.5}
@media(max-width:560px){.score-grid{grid-template-columns:1fr}}
.chart-upload-grid{display:grid;grid-template-columns:minmax(160px,1.1fr) minmax(130px,.75fr) minmax(190px,1.3fr) auto;gap:12px;align-items:end;margin-top:17px}.chart-upload-grid .field{margin:0}.chart-upload-grid label span{display:block;margin-bottom:7px;font-size:11px;color:var(--sub)}.chart-upload-grid input,.chart-upload-grid select{width:100%;padding:10px 11px;border:1px solid var(--line);background:#0c1727;color:var(--ink);border-radius:8px}.chart-upload-grid .button{min-height:40px}.chart-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.chart-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:13px 0}.chart-stats div{font-size:10px;color:var(--sub);background:#101c2d;border-radius:6px;padding:7px}.chart-stats strong{display:block;font-size:13px;color:var(--ink);margin-top:3px}@media(max-width:1100px){.chart-upload-grid{grid-template-columns:1fr 1fr}.chart-upload-grid .button{align-self:end}}@media(max-width:580px){.chart-upload-grid{grid-template-columns:1fr}.chart-stats{grid-template-columns:1fr 1fr}}

/* Interdisciplinary Council: research requests, manual CSV import and cross-asset verification */
.council-req{display:grid;grid-template-columns:minmax(170px,1.25fr) minmax(150px,1fr) auto minmax(160px,1.2fr) auto;align-items:center;gap:12px;padding:13px;border-top:1px solid var(--line)}
.council-req .file-picker{max-width:185px;color:var(--sub);font-size:11px}
.council-req .req-status{font-size:11px;color:var(--sub)}
.council-req .req-symbol{color:var(--ink);font-size:13px;font-weight:700}
.council-req .req-name{font-size:11px;color:var(--sub);margin-top:4px}
.council-step{display:inline-block;border-radius:20px;border:1px solid var(--line);color:var(--sub);padding:5px 10px;font-size:10px}
.council-step.ok{border-color:rgba(102,221,187,.5);color:var(--mint)}
.council-step.warn{border-color:rgba(240,186,114,.5);color:var(--amber)}
.council-mech{background:#111e2e;border:1px solid #283952;border-radius:10px;padding:13px 15px}
.council-mech strong{font-size:12px}
.council-mech p{font-size:11px;line-height:1.65;color:var(--sub);margin:6px 0}
.council-pairs{width:100%;border-collapse:collapse;font-size:12px}
.council-pairs th,.council-pairs td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.council-pairs th{font-size:10px;text-transform:uppercase;color:var(--sub);letter-spacing:.07em}
@media(max-width:1000px){.council-req{grid-template-columns:1fr 1fr}.council-req .button{max-width:160px}}
@media(max-width:560px){.council-req{grid-template-columns:minmax(0,1fr)}.council-req>*{min-width:0;max-width:100%}.council-req .file-picker{width:100%;max-width:100%}}

/* Unified hypothesis-to-data-to-bias research cycle. */
.cycle-status{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;background:#111e2e;border:1px solid #283952;border-radius:10px;padding:15px;margin-top:14px}
.cycle-status strong{display:block;font-size:17px;margin:8px 0}
.cycle-bias{display:flex;align-items:flex-end;gap:8px;flex-direction:column;min-width:160px}
@media(max-width:650px){.cycle-status{flex-direction:column}.cycle-bias{align-items:flex-start;flex-direction:row;flex-wrap:wrap}}

/* iPhone-friendly navigation, tap areas and CSV forms for the hosted version. */
@media(max-width:600px){
  .sidebar{-webkit-overflow-scrolling:touch;gap:12px}
  .nav-item{min-height:44px}
  .topbar{height:auto;min-height:56px;padding:8px 12px;justify-content:flex-end}
  .topbar .breadcrumb{display:none}
  .top-actions{gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .top-actions .button{min-height:42px;padding:8px 11px;font-size:11px}
  .field input,.field select,.field textarea,.search,.file-picker{font-size:16px!important}
  .council-pairs{display:block;max-width:100%;overflow-x:auto}
  .panel{min-width:0}
  .chart-list{grid-template-columns:minmax(0,1fr)}
}

/* Four-window forecast ledger: responsive, independently scored market predictions */
.window-toolbar{padding:17px 20px;display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:16px}
.window-toolbar input[type=date]{width:185px;max-width:100%;background:#0c1727;border:1px solid #43516a;color:#e9eff6;padding:10px;border-radius:8px;font-size:16px}
.window-actions{display:flex;flex-wrap:wrap;gap:8px}
.window-actions .button{min-height:42px}
.window-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:15px}
.window-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.window-card{padding:18px;min-width:0;overflow-wrap:anywhere}
.window-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.window-top h2{font-size:23px;letter-spacing:-.02em;margin:5px 0 4px}
.window-card p{font-size:12px;line-height:1.7;color:#cbd7e3}
.window-dir{font-size:20px;font-weight:700;margin-top:15px}

/* v0.9.1 signal-first UI: disclose depth only when requested. */
.signal-hero{padding:24px 26px;margin-bottom:16px;border-color:#34516a;background:linear-gradient(130deg,#14243a 0%,#101c2e 70%,#111a2b 100%)}

.progressive-fold>summary:after{content:'+';font-size:23px;color:#91b8c8;line-height:1;flex-shrink:0}

.progressive-fold[open]>summary:after{content:'−'}
.fold-content{padding:15px 17px}
.fold-content>.panel{margin:0!important}
.fold-content>.section-hd:first-child{margin-top:0}
.signal-window-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.signal-window-card{padding:16px 18px;min-width:0}
.signal-window-card .signal-word{font-size:clamp(24px,3.3vw,36px);margin:10px 0 4px}
.signal-window-card .signal-foot{font-size:11px;color:#92a4b9}

.signal-compact-stats{color:#afc0d2;font-size:12px;padding:8px 0 2px}
@media(max-width:650px){.signal-hero{padding:20px 18px}.signal-window-grid{grid-template-columns:1fr;gap:10px}.signal-window-card{padding:15px}.progressive-fold>summary{padding:14px}.fold-content{padding:12px}.signal-cta .button{flex-grow:1}}

<body><div id="root"></div><script>
const ICON={overview:'◫',stream:'≋',connections:'⌁',replay:'◷',sources:'◎',research:'◉',macro:'▤',news:'≋',geopolitics:'◎',logistics:'♧',market:'⌁',positioning:'◉',research:'⊕'};
let s={mode:'live',page:'overview',data:null,selected:null,filter:'all',query:'',replay:null,modal:null,connection:null,busy:false,research:null,researchQuestion:'',council:null,windows:null,windowPerformance:null,windowDate:null};
const stagedUploads={chart:null,council:{},window:{}};
const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const fmt=x=>{try{return new Date(x).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC',hour12:false})+' UTC'}catch{return x}};
const api=async (route,method='GET',body)=>{const r=await fetch(route,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d};
const notify=t=>{document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4200)};
// Signal-first disclosure state survives SPA rerenders (without moving or deleting data).
const disclosureState=Object.create(null);
function fold(key,title,body,description='',openByDefault=false){
 const opened=Object.prototype.hasOwnProperty.call(disclosureState,key)?disclosureState[key]:openByDefault;
 return `<details class="progressive-fold" data-fold="${esc(key)}" ${opened?'open':''}><summary><span><span class="fold-name">${esc(title)}</span>${description?`<span class="fold-help">${esc(description)}</span>`:''}</span></summary><div class="fold-content">${body}</div></details>`;
}
function signalClass(value){return value==='Bullish'?'signal-bull':value==='Bearish'?'signal-bear':value==='Flat'?'signal-flat':'signal-pending'}
function currentHeldBias(){return s.council?.assessment?.fundamental_bias||s.council?.last_run?.fundamental_bias||null}
function macroSignal(b){const value=['Bullish','Bearish'].includes(b?.direction)?b.direction:'Unestablished';
 const state=b?.state||'Not established',basis=b?.basis||'No persisted thesis';
 return `<section class="panel signal-hero" aria-label="Held fundamental gold bias"><div class="signal-hero-label">GOLD / XAUUSD · HELD FUNDAMENTAL BIAS</div><div class="signal-hero-row"><div class="signal-word ${signalClass(value)}">${esc(value==='Unestablished'?'NO BIAS':value.toUpperCase())}</div><span class="pill">${esc(state)}</span></div><div class="signal-foot">${esc(basis)} · Research thesis, not a live market quote or a trading instruction.</div></section>`;
}
function scope(){let ev=s.data?.events||[];return s.replay==null?ev:ev.slice(0,s.replay)}
function calculate(events){const n=s.data?.state.narratives||[];return n.map(x=>{let balance=events.reduce((a,e)=>a+(Number(e.impacts?.[x.id])||0),0);return {...x,balance,status:balance>=3?'Strengthening':balance>0?'Emerging':balance<0?'Contested':'Undetermined',support_events:events.filter(e=>e.impacts?.[x.id]>0).length,counter_events:events.filter(e=>e.impacts?.[x.id]<0).length}})}
function navIcon(n){return {'overview':'▦','research':'✧','stream':'≡','connections':'⌁','replay':'◷','sources':'⚙','charts':'▥','council':'◇','windows':'◷'}[n]}
function baseLayout(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">N</div><div><strong>NARRATIVE OS</strong><small>MACRO INTELLIGENCE</small></div></div><div class="nav-label">WORKSPACE</div><nav class="nav">${[['overview','Overview'],['research','Quick AI questions'],['stream','Evidence stream'],['connections','Connection library'],['charts','Chart CSV imports'],['council','Research Studio'],['windows','4 Window Auditor'],['replay','Historical replay'],['sources','Data sources']].map(([id,label])=>`<button class="nav-item ${s.page===id?'active':''}" data-nav="${id}" title="${label}"><b style="width:20px;font-size:18px;font-weight:400;text-align:center">${navIcon(id)}</b><span>${label}</span></button>`).join('')}</nav><div class="side-bottom"><div class="eyebrow"><span class="mini-light"></span>Research environment</div><div class="aside-copy">Evidence first. Interpretations are hypotheses, not trading signals.</div></div></aside><main class="main"><div class="topbar"><div class="breadcrumb">Workspace &nbsp;/&nbsp; <strong>${({overview:'Overview',research:'Quick AI questions',stream:'Evidence stream',connections:'Connection library',replay:'Historical replay',sources:'Data sources',charts:'Chart CSV imports',council:'Research Studio',windows:'4 Window Auditor'})[s.page]}</strong></div><div class="top-actions"><div class="chip"><span style="color:var(--mint)">●</span> XAU/USD</div><div class="chip ${s.mode==='demo'?'':'mint'}">${s.mode==='demo'?'SIMULATED':'WEB RESEARCH'}</div><button class="button small" data-act="refresh" title="Scan public web for current evidence">⌕ <span>Scan web</span></button><button class="button primary small" data-act="add">＋ <span>Add evidence</span></button>${s.data?.cloud_deployment?`<button class="button small" data-act="logout" title="Sign out of this private workspace">Sign out</button>`:''}</div></div><div class="workspace" id="workspace">${renderPage()}<div class="footer"><span>© Narrative OS · Research prototype · Not financial advice</span><span>Scores are qualitative research ratings, not calibrated probabilities or trade signals</span></div></div></main></div>${renderModal()}`}
function heading(title,sub,controls=true){return `<div class="heading"><div><div class="eyebrow">FUNDAMENTAL INTELLIGENCE / GOLD</div><h1>${title}</h1><p>${sub}</p></div>${controls?`<div class="header-tools"><div class="mode-toggle">${['demo','live','manual'].map(m=>`<button data-mode="${m}" class="${s.mode===m?'selected':''}">${({demo:'Demo replay',live:'Live sources',manual:'My research'})[m]}</button>`).join('')}</div>${s.mode==='demo'?`<button class="button small" data-act="demo-next">Next demo event →</button><button class="button small ghost" data-act="reset">Reset</button>`:''}</div>`:''}</div>`}
function notice(){return s.mode==='demo'?`<div class="notice"><span style="font-size:15px">◇</span><span><strong>Simulation mode</strong> — All events, timings and narrative changes below are invented training scenarios. They are not historical market facts.</span></div>`:s.mode==='live'?`<div class="notice warn"><span style="font-size:15px">◷</span><span><strong>Source-fed mode</strong> — Shows imported evidence after a successful scan, plus any research overlays. Unverified reports are not trading signals; unsupported claims remain neutral.</span></div>`:`<div class="notice"><span style="font-size:15px">✎</span><span><strong>Research workspace</strong> — Add evidence and explicitly score how it affects each hypothesis. Heuristic interpretations are not automated market conclusions.</span></div>`}
function metrics(ev){let contra=ev.filter(e=>Object.values(e.impacts||{}).some(v=>v<0)).length;return `<div class="metrics"><div class="panel metric"><div class="metric-label">Available evidence <span class="metric-icon">◷</span></div><strong>${ev.length}</strong><em>Items in current evidence window</em></div><div class="panel metric"><div class="metric-label">Active hypotheses <span class="metric-icon">⌁</span></div><strong class="accent">3</strong><em>Competing macro explanations</em></div><div class="panel metric"><div class="metric-label">Scored evidence <span class="metric-icon">◉</span></div><strong>${ev.filter(e=>!!e.score).length}</strong><em>Automatically rated / labelled</em></div><div class="panel metric"><div class="metric-label">Counter-evidence <span class="metric-icon">↘</span></div><strong class="orange">${contra}</strong><em>Items with a negative impact</em></div></div>`}
function narrCards(ev){return `<div class="narratives">${calculate(ev).map(n=>{let c=({rates:'var(--orange)',haven:'var(--mint)',growth:'var(--blue)'})[n.id];let pct=Math.min(50,Math.abs(n.balance)*7);let left=n.balance>=0?50:50-pct;return `<article class="panel narrative" style="--accent:${c}" data-which="${n.id}" tabindex="0"><div class="narr-top"><span class="narr-symbol">${({rates:'↗',haven:'◇',growth:'↘'})[n.id]}</span><span class="pill ${n.balance>=3?'positive':n.balance<0?'negative':''}">${n.status}</span></div><h3>${esc(n.name)}</h3><div class="sub">${esc(n.subtitle)}</div><div class="balance-track"><div class="balance-fill" style="left:${left}%;width:${pct}%"></div></div><div class="narr-foot"><span>${n.support_events} supporting · ${n.counter_events} challenging</span><span>Balance ${n.balance>0?'+':''}${n.balance}</span></div></article>`}).join('')}</div>`}
function eventFeed(ev,all=false){let filtered=ev.filter(e=>(s.filter==='all'||e.type===s.filter)&&(!s.query||(e.title+' '+e.detail).toLowerCase().includes(s.query.toLowerCase())));return `<div class="panel stream"><div class="panel-hd"><div><strong>Evidence stream</strong><div class="helper">${ev.length} source-tagged events · newest first</div></div><input class="search" id="search" value="${esc(s.query)}" placeholder="Search evidence" aria-label="Search evidence"/></div><div class="filterbar">${['all','macro','news','geopolitics','logistics','market','positioning','research'].map(f=>`<button data-filter="${f}" class="${s.filter===f?'selected':''}">${f==='all'?'All':f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div><div class="events" ${all?'style="max-height:none"':''}>${filtered.length?filtered.slice().reverse().map(e=>`<div class="event ${s.selected===e.id?'active':''}" data-event="${esc(e.id)}" tabindex="0"><div class="event-bullet">${ICON[e.type]||'◌'}</div><div class="event-info"><div class="event-row"><span class="tag">${esc(e.type)}</span><time class="time">${esc(fmt(e.time))}</time></div><div class="event-title">${esc(e.title)}</div><div class="event-desc">${esc(e.detail)}</div><div class="event-foot">${e.score?`<span class="mini-tag">Significance ${Number(e.score.significance?.value)||0}/5</span><span class="mini-tag">${esc(e.score.method==='ai'?'AI rated':e.score.method==='rules'?'Rule rated':e.score.method==='demo'?'Simulated':'User')}</span>`:''}${Object.entries(e.impacts||{}).filter(([k,v])=>v!==0).map(([k,v])=>`<span class="mini-tag ${v>0?'up':'down'}">${esc(k)} ${v>0?'+':''}${v}</span>`).join('')||'<span class="mini-tag">Impact neutral / unverified</span>'}</div></div></div>`).join(''):`<div class="empty"><strong>No matching evidence</strong>${s.mode==='live'?'Refresh sources, check their connection status, or wait for new releases.':'Try another filter or add a research item.'}</div>`}</div></div>`}
function scorePanel(e){
  let q=e.score;
  if(!q)return `<div class="note-box">This older evidence record has not been scored. A new scan or app restart will backfill it.</div>`;
  const dims=[['reliability','Source reliability'],['novelty','Novelty'],['significance','Market significance'],['unconventional','Unconventional relevance']];
  let method=({ai:'AI-assisted',rules:'Rule-based',demo:'Simulation',manual:'User override'})[q.method]||'Research';
  let ratings=dims.map(([k,label])=>{let o=q[k]||{},v=Math.max(0,Math.min(5,Number(o.value)||0));return `<div class="score-tile"><div class="score-top"><span>${label}</span><span class="score-num">${v}<span style="font-size:10px;color:var(--sub)">/5</span></span></div><div class="score-track"><div class="score-fill" style="width:${v*20}%"></div></div><div class="score-why">${esc(o.reason||'Not evaluated')}</div></div>`}).join('');
  let impact=['rates','haven','growth'].map(k=>{let v=Math.max(-2,Math.min(2,Number(e.impacts?.[k])||0));return `<span class="mini-tag ${v>0?'up':v<0?'down':''}">${esc(({rates:'Rates',haven:'Safe haven',growth:'Growth'})[k])}: ${v>0?'+':''}${v}</span>`}).join('');
  return `<section class="score-wrap"><div class="eyebrow">AUTOMATED EVIDENCE ASSESSMENT</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin:9px 0"><strong style="font-size:12px">Why this evidence matters</strong><span class="score-pill ${esc(q.method)}">${esc(method)}</span></div><div class="score-grid">${ratings}</div><div class="eyebrow" style="margin-top:12px">NARRATIVE IMPACT · −2 TO +2</div><div class="score-impact">${impact}</div><div class="score-explainer">${esc(q.impact_reason||'No explained narrative impact available.')}</div><div class="score-reminder">${esc(q.limitations||'These ratings are qualitative assessments, not probabilities or trading signals.')} ${q.scored_at?'· Scored '+esc(fmt(q.scored_at)):''}</div></section>`;
}
function linkedConnections(e){const t=(e.title+' '+e.detail).toLowerCase();const rules=[['freight',/shipping|marine|freight|tanker|insurance|port|logistics/],['power',/electricity|power grid|energy demand|natural gas/],['jobs',/payroll|unemployment|temporary worker|jobs|hiring|employment/],['auctions',/auction|treasury|bond yield|real yield|funding/],['food',/crop|drought|food prices|harvest|weather/],['flows',/etf|positioning|central bank|physical gold/]];return rules.filter(([id,re])=>re.test(t)).slice(0,3).map(([id])=>s.data.connections.find(c=>c.id===id)).filter(Boolean)}
function eventDetail(ev){let e=ev.find(x=>x.id===s.selected)||ev[ev.length-1];if(!e)return `<div class="panel"><div class="empty"><strong>No evidence selected</strong>Choose an item from the stream to compare interpretive lenses.</div></div>`;let lenses=[['retail','RETAIL / STANDARD HEURISTIC',e.retail],['professional','INSTITUTIONAL-STYLE HYPOTHESIS',e.professional],['unusual','CROSS-DISCIPLINARY LINK',e.unconventional],['falsifier','WHAT WOULD CHALLENGE THIS?',e.falsifier]];return `<section class="panel"><div class="panel-hd"><strong>Evidence intelligence</strong><span class="pill">${esc((/^(OpenAI|ChatGPT)/.test(e.analysis_method||''))?'AI interpreted':'Research lenses')}</span></div><div class="detail"><div class="eyebrow">SELECTED EVIDENCE · ${esc(e.type).toUpperCase()}</div><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p>${scorePanel(e)}${e.source?`<a class="detail-source" href="${esc(safeurl(e.source))}" target="_blank" rel="noopener noreferrer">Open source ↗</a>`:'<span class="detail-source">No external source · research/demo item</span>'}${lenses.map(([cls,t,body])=>`<div class="lens ${cls}"><div class="lens-top">${({retail:'◌',professional:'◈',unusual:'⌁',falsifier:'⊘'})[cls]} &nbsp;${t}</div><div class="lens-body">${esc(body||'Not yet assessed. Configure AI and request an analysis for this source evidence.')}</div></div>`).join('')}${linkedConnections(e).length?`<div style="padding:11px 0 13px;border-top:1px solid var(--line)"><div class="eyebrow" style="margin-bottom:8px">POTENTIAL CAUSAL LINKS</div><div style="display:flex;gap:6px;flex-wrap:wrap">${linkedConnections(e).map(c=>`<button class="button small ghost" data-connection="${esc(c.id)}">⌁ ${esc(c.domain)} ↗</button>`).join('')}</div></div>`:''}<div class="detail-actions"><button class="button small" data-act="copy-evidence">Copy brief</button>${s.mode!=='demo'?`<button class="button small" data-act="analyse">Refine with AI ↗</button>`:''}</div><p style="margin:11px 0 0;font-size:10px;color:var(--muted)">Interpretations are conditional. Institutional-style views do not represent observed private institutional beliefs.</p></div></section>`}
function safeurl(s){try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function connectionsGrid(){return `<div class="connection-grid">${(s.data?.connections||[]).map(c=>`<button class="panel connection-card" data-connection="${esc(c.id)}"><span class="domain">${esc(c.domain)}</span><h3>${esc(c.title)}</h3><p>${esc(c.horizon)} · Explore mechanism ↗</p></button>`).join('')}</div>`}
function replay(){let length=s.data?.events.length||0;let count=s.replay??length;return `<div class="panel replay-card"><div class="replay-top"><div><strong style="font-size:13px">Point-in-time replay</strong><div class="hint">Only evidence at or before this step affects the dashboard.</div></div><div class="replay-controls"><button class="button small" data-act="rewind" ${count===0?'disabled':''}>← Previous</button><button class="button small" data-act="advance" ${count===length?'disabled':''}>Next →</button><button class="button small ghost" data-act="replay-live">Full window</button></div></div><input id="replay-slider" type="range" min="0" max="${length}" value="${count}" aria-label="Choose evidence cutoff"/><div class="replay-markers"><span>Before first event</span><span>${length} evidence steps</span><span>Latest available</span></div><div class="replay-foot"><span>Showing <strong style="color:var(--ink)">${count} / ${length}</strong> events ${count?'· Through '+fmt(s.data.events[count-1].time):''}</span><span>${s.mode==='demo'?'Simulated timeline':'Ingestion time and publication time can differ. No point-in-time vintage guarantee.'}</span></div></div>`}
function marketStrip(){let m=s.data?.market||{}, defs=[['gold','GOLD / XAUUSD','USD/oz'],['dollar','DOLLAR INDEX','pts'],['real_yield','10Y TIPS REAL YIELD','%']];return `<div class="section-hd"><div><h2>Market context · source dated</h2><p>Manual CSV imports take precedence when available. Values are snapshots, NOT live bid/ask quotes.</p></div><button class="button small" data-act="refresh">Scan latest ↻</button></div><div class="metrics market-strip">${defs.map(([id,label,unit])=>{let x=m[id];return `<div class="panel metric"><div class="metric-label">${label}<span class="metric-icon">${id==='real_yield'?'◷':'↗'}</span></div><strong class="${x?'accent':''}">${x?Number(x.value).toLocaleString('en-GB',{maximumFractionDigits:3}):'—'}</strong><em>${x?esc(x.unit||unit)+' · '+esc(x.observation_date):'Not available; run web scan'}</em>${x?`<div class="market-sub">${x.manual_csv?'USER CSV · ':''}${x.change_percent!=null?`Previous close ${x.change_percent>=0?'+':''}${x.change_percent.toFixed(2)}%`:x.change_pp!=null?`Change ${x.change_pp>=0?'+':''}${x.change_pp.toFixed(3)} pp`:'No comparison available'}${x.proxy?' · PROXY':''}</div>${x.source?`<a class="market-link" href="${esc(safeurl(x.source))}" target="_blank" rel="noopener noreferrer">Source ↗</a>`:`<span class="market-sub">Manual chart CSV · no live connection</span>`}`:''}</div>`}).join('')}<div class="panel metric market-explainer"><div class="metric-label">RESEARCH STATUS</div><strong class="accent" style="font-size:20px">${(s.data?.auth?.sharing||s.data?.auth?.api_key_configured)?'AI ready':'Rules only'}</strong><em>${s.data?.auth?.api_key_configured?'Cloud API configured · on-demand only':s.data?.auth?.sharing?'ChatGPT connected · '+(s.data?.automatic_ai?'background AI allowed':'manual AI only'):'Open Data sources for AI setup.'}</em><button class="button small" style="margin-top:10px" data-nav="sources">Manage connection</button></div></div>`}
function researchPanel(){
 const r=s.research;
 const intro=`<div class="panel" style="padding:20px 24px;margin-bottom:20px"><div class="eyebrow">ON-DEMAND WEB SCAN + AI INTERPRETATION</div><h2 style="margin:8px 0 6px">Ask a fundamental question</h2><p class="hint">Your question triggers a fresh headline search and an AI review of possible interpretations. Source headlines are not independently confirmed facts.</p><form id="research-form" style="margin-top:17px;display:flex;flex-wrap:wrap;gap:10px"><input class="search" id="research-q" name="question" required minlength="4" maxlength="450" style="flex:1;min-width:220px;max-width:none;padding:11px 14px" placeholder="e.g. Why is gold strong despite higher real yields?" value="${esc(s.researchQuestion)}"><button class="button primary" type="submit" ${s.busy?'disabled':''}>Search &amp; analyse ↗</button></form><p class="hint">Cloud AI research runs only when submitted; API calls may incur charges.</p></div>`;
 if(!r)return intro;
 const interpretations=[['retail','Retail interpretation'],['professional','Professional-style hypothesis'],['unconventional','Unusual connections'],['contradictions','Contradictions'],['next_checks','Evidence to check next'],['uncertainty','Unknowns / limitations']].map(([key,name])=>`<div class="lens"><div class="lens-top">${name}</div><div class="lens-body">${esc(r.analysis?.[key]||'Not available')}</div></div>`).join('');

>${[-2,-1,0,1,2].map(v=>`<option value="${v}" ${v===0?'selected':''}>${v>0?'+':''}${v} ${v===0?'Neutral':''}</option>`).join('')}</select></div>`).join('')}</div></div><div class="modal-footer"><button type="button" class="button" data-act="close">Cancel</button><button class="button primary" type="submit">Save evidence</button></div></form></div>`;return ''}
function render(){let prior=document.activeElement?.id==='search';let cursor=prior?document.activeElement.selectionStart:0;$('#root').innerHTML=baseLayout();if(prior&&$('#search')){$('#search').focus();$('#search').setSelectionRange(cursor,cursor)}}
async function load(remember=false){let prev=remember?s.selected:null;try{s.data=await api('/api/bootstrap?mode='+s.mode);try{s.council=await api('/api/council/current')}catch(err){console.warn('Council data unavailable',err)}if(s.page==='windows'){try{await refreshWindowDashboard()}catch(err){notify(err.message)}}let ev=s.data.events;s.selected=prev&&ev.find(x=>x.id===prev)?prev:ev.at(-1)?.id||null;if(s.replay!=null)s.replay=Math.min(s.replay,ev.length);render()}catch(e){notify(e.message)}}
function openModal(name){s.modal=name;s.connection=null;render()}
function closeModal(){s.modal=null;s.connection=null;render()}
async function act(a,el){if(s.busy&&a!=='close')return;
try{if(a==='window-forecast'){
  if(!confirm('Lock every remaining future window forecast? These AI calls are billed separately and cannot be edited afterward.'))return;
  try{s.busy=true;notify('Generating and timestamp-locking the eligible window forecasts…');
    const unready=s.windows?.requirements?.summary?.required_not_ready||0;
    const allowPartial=unready>0;
    if(allowPartial&&!confirm(unready+' required ticker CSV(s) are missing, stale or incomplete. Lock provisional window forecasts with partial evidence anyway? The missing inputs will be recorded.'))return;
    const res=await api('/api/windows/forecast','POST',{date:s.windowDate,allow_partial:allowPartial});
    await refreshWindowDashboard();render();notify('Locked '+res.count+' future windows before they start.');
  }catch(err){notify(err.message)}finally{s.busy=false}return;
}
if(a==='window-refresh-tickers'){
  if(!confirm('Ask OpenAI to select a new theory-specific ticker basket? This makes a separately billed API call.'))return;
  try{s.busy=true;notify('AI is selecting the most informative cross-market tickers and intervals…');
    await api('/api/windows/requirements/refresh','POST',{});
    await refreshWindowDashboard();render();notify('Ticker requests updated. Upload required CSVs to strengthen the four-window forecast.');
  }catch(err){notify(err.message)}finally{s.busy=false}return;
}
if(a==='window-csv-import'){
  const symbol=el.dataset.symbol,interval=el.dataset.interval,key=symbol+'|'+interval;
  const input=[...document.querySelectorAll('[data-window-csv]')].find(x=>x.dataset.windowCsv===key);
  const file=stagedUploads.window[key]||input?.files?.[0];
  if(!file){notify('Select the '+symbol+' '+interval+' CSV first.');return}
  try{s.busy=true;notify('Validating '+symbol+' '+interval+' CSV…');
    const response=await fetch('/api/chart/import?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(interval),
      {method:'POST',headers:{'Content-Type':'text/csv','X-Filename':file.name},body:file});
    const result=await response.json();if(!response.ok)throw Error(result.detail||'Import failed');
    delete stagedUploads.window[key];await refreshWindowDashboard();render();
    notify('Imported '+result.bars+' candles for '+symbol+' '+interval+'.');
  }catch(err){notify(err.message)}finally{s.busy=false}return;
}
if(a==='window-audit'){
  try{s.busy=true;const res=await api('/api/windows/audit','POST',{});
    await refreshWindowDashboard();render();notify(res.count+' newly adjudicated window(s). Others may need a fresh complete CSV.');
  }catch(err){notify(err.message)}finally{s.busy=false}return;
}
if(a==='cloud-migrate'){
  const file=document.getElementById('cloud-db-file')?.files?.[0];
  if(!file){notify('Select your earlier narrative.db file first');return}
  if(!confirm('Import research from '+file.name+' into this private workspace? Keep the original as a backup.'))return;
  try{s.busy=true;notify('Importing previous Narrative OS research…');
    const resp=await fetch('/api/admin/import-db',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});
    const out=await resp.json();if(!resp.ok)throw Error(out.detail||'Migration unsuccessful');
    await load(true);notify('Migration complete: '+JSON.stringify(out.imported));
  }catch(err){notify(err.message)}finally{s.busy=false}return
}
if(a==='logout'){const f=document.createElement('form');f.method='POST';f.action='/logout';document.body.appendChild(f);f.submit();return}if(a==='add')return openModal('add');if(a==='close')return closeModal();if(a==='add-connection'){let c=s.data.connections.find(x=>x.id===s.connection);openModal('add');setTimeout(()=>{if($('#ev-title'))$('#ev-title').value='Investigate: '+c.title},0);return}
if(a==='refresh'){s.busy=true;notify('Scanning public sources; results may be delayed…');const r=await api('/api/live/refresh','POST');let msgs=Object.entries(r).map(([k,v])=>k+': '+(v.error?'unavailable':v.analysed!=null?v.analysed+' analysed':(v.new||0)+' new')).join('; ');notify(msgs||'No external feeds enabled');await load(true)}
if(a==='research'){s.page='research';render();return}
if(a==='rewind'){s.replay=Math.max(0,(s.replay??s.data.events.length)-1);render()}
if(a==='advance'){s.replay=Math.min(s.data.events.length,(s.replay??s.data.events.length)+1);render()}
if(a==='replay-live'){s.replay=null;render()}
if(a==='reset'){await api('/api/demo/reset','POST');s.replay=null;await load();notify('Simulation reset')}
if(a==='demo-next'){let r=await api('/api/demo/next','POST');s.replay=null;await load();notify(r.added?'Next scenario event revealed':'All demo evidence revealed')}
if(a==='copy-evidence'){let e=scope().find(x=>x.id===s.selected);if(!e)return;await navigator.clipboard.writeText([e.title,e.detail,'Retail: '+e.retail,'Professional-style: '+e.professional,'Unconventional: '+e.unconventional,'Falsifier: '+e.falsifier,'Source: '+(e.source||'none')].join('\n\n'));notify('Evidence brief copied')}
if(a==='connect'){const tab=window.open('about:blank','_blank');try{const r=await api('/api/auth/start','POST');if(tab)tab.location.href=r.url;else window.location.href=r.url;notify('Complete the official ChatGPT authorisation in the opened tab.')}catch(err){tab?.close();throw err}return}
if(a==='disconnect'){await api('/api/auth/disconnect','POST');await load(true);notify('ChatGPT disconnected');return}
if(a==='analyse'){let e=scope().find(x=>x.id===s.selected);if(!e)return;s.busy=true;notify('Requesting AI score refinement and explanation…');await api('/api/ai/analyse','POST',{id:e.id});await load(true);notify('AI ratings and explanations saved; the report is still not independently verified')}
if(a==='council-upload'){const symbol=el.dataset.symbol,interval=el.dataset.interval;const input=[...document.querySelectorAll('[data-csv]')].find(x=>x.dataset.csv===symbol+'|'+interval);const file=stagedUploads.council[symbol+'|'+interval]||input?.files?.[0];if(!file){notify('Select a CSV for '+symbol+' '+interval+' first');return}try{s.busy=true;notify('Importing '+symbol+'…');const response=await fetch('/api/chart/import?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(interval),{method:'POST',headers:{'Content-Type':'text/csv','X-Filename':file.name},body:file});const result=await response.json();if(!response.ok)throw Error(result.detail||'Import failed');delete stagedUploads.council[symbol+'|'+interval];await load(true);s.page='council';render();notify('CSV uploaded: '+symbol+' · '+result.bars+' candles')}catch(err){notify(err.message)}finally{s.busy=false}return}
if(a==='council-run'){try{s.busy=true;notify('Aligning the imported price series and checking evidence…');const synth=!!document.getElementById('council-ai-synthesis')?.checked;const out=await api('/api/council/run','POST',{ai_synthesis:synth,refresh_evidence:el.dataset.refresh==='1'});s.council={...s.council,last_run:out.report,assessment:out.report};render();notify(out.report.status==='ready-for-synthesis'?'Cross-market analysis completed; check limits':'Data missing or stale; see the requirements and partial results')}catch(err){notify(err.message)}finally{s.busy=false}return}
if(a==='export'){let blob=new Blob([JSON.stringify({mode:s.mode,exported_at:new Date().toISOString(),events:s.data.events,narratives:calculate(s.data.events)},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob);let l=document.createElement('a');l.href=u;l.download='narrative-os-'+s.mode+'.json';l.click();URL.revokeObjectURL(u);notify('Research JSON exported')}
}catch(e){notify(e.message)}finally{s.busy=false}}
document.addEventListener('toggle',e=>{if(e.target.matches?.('[data-fold]')&&document.contains(e.target))disclosureState[e.target.dataset.fold]=e.target.open},true);
document.addEventListener('click',async e=>{let t=e.target.closest('[data-nav],[data-mode],[data-event],[data-filter],[data-act],[data-connection],[data-which]');if(!t){if(e.target.dataset.cover)closeModal();return}if(t.dataset.nav){s.page=t.dataset.nav;s.replay=null;if(s.page==='windows'){try{await refreshWindowDashboard()}catch(err){notify(err.message)}}render();window.scrollTo(0,0)}else if(t.dataset.mode){s.mode=t.dataset.mode;s.selected=null;s.replay=null;s.filter='all';s.query='';await load()}else if(t.dataset.event){s.selected=t.dataset.event;render()}else if(t.dataset.filter){s.filter=t.dataset.filter;render()}else if(t.dataset.connection){s.connection=t.dataset.connection;render()}else if(t.dataset.which){let n=s.data.state.narratives.find(x=>x.id===t.dataset.which);notify(n.name+': '+n.tests.join(' · '))}else if(t.dataset.act){await act(t.dataset.act,t)}});
document.addEventListener('change',async e=>{
if(e.target.matches('[data-window-csv]')){const key=e.target.dataset.windowCsv,f=e.target.files?.[0];
 if(f){stagedUploads.window[key]=f;const label=e.target.parentElement?.querySelector('[data-upload-label]');if(label)label.textContent='Selected: '+f.name;}}
if(e.target.matches('[data-csv]')){const k=e.target.dataset.csv;const f=e.target.files?.[0];if(f){stagedUploads.council[k]=f;const label=e.target.parentElement?.querySelector('[data-upload-label]');if(label)label.textContent='Selected: '+f.name}};
if(e.target.matches('input[name=csv]')){const f=e.target.files?.[0];if(f){stagedUploads.chart=f;const label=e.target.parentElement?.querySelector('[data-upload-label]');if(label)label.textContent='Selected: '+f.name}};
if(e.target.id==='window-date'){s.windowDate=e.target.value;try{await refreshWindowDashboard();render()}catch(err){notify(err.message)}return}
if(e.target.id==='window-auto'){try{const r=await api('/api/windows/auto','POST',{enabled:e.target.checked});await refreshWindowDashboard();render();notify(r.enabled?'Automatic weekday forecasting enabled (paid API calls)':'Automatic forecasting disabled')}catch(err){notify(err.message);await refreshWindowDashboard();render()}return}
if(e.target.id==='manual-score-override'){const panel=$('#manual-impact-controls');if(panel)panel.style.display=e.target.checked?'block':'none'}
if(e.target.id==='auto-ai'){try{let r=await api('/api/ai/automatic','POST',{enabled:e.target.checked});s.data.automatic_ai=r.automatic_ai;notify(r.automatic_ai?'Background AI score refinement enabled':'Background AI score refinement disabled');render()}catch(err){notify(err.message);await load(true)}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){s.query=e.target.value;render()}if(e.target.id==='replay-slider'){s.replay=Number(e.target.value);render()}});
document.addEventListener('submit',async e=>{if(e.target.id==='bias-seed-form'){e.preventDefault();const f=new FormData(e.target);try{s.busy=true;const response=await api('/api/council/bias/adopt','POST',{direction:String(f.get('direction')),rationale:String(f.get('rationale'))});s.council=response;render();notify('Provisional working thesis saved. Re-run the council to record an updated analysis.')}catch(err){notify(err.message)}finally{s.busy=false}return}if(e.target.id==='council-plan-form'){e.preventDefault();const f=new FormData(e.target);try{s.busy=true;notify('Discovering unconventional mechanisms and selecting a targeted ticker basket…');s.council=await api('/api/council/plan','POST',{question:String(f.get('question')||''),focus:String(f.get('focus')||''),horizon:String(f.get('horizon')||'intraday'),ai_refine:!!f.get('ai_refine'),discover_news:!!f.get('discover_news')});s.page='council';render();notify('Research cycle saved: review competing theories and export requested CSVs')}catch(err){notify(err.message)}finally{s.busy=false}return}if(e.target.id==='chart-upload-form'){e.preventDefault();const f=new FormData(e.target);const file=stagedUploads.chart||f.get('csv');if(!file||!file.size){notify('Choose a CSV to import');return}try{s.busy=true;notify('Validating and importing user chart CSV…');const symbol=String(f.get('symbol')||'').trim(),interval=String(f.get('interval')||'');const response=await fetch('/api/chart/import?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(interval),{method:'POST',headers:{'Content-Type':'text/csv','X-Filename':file.name},body:file});const d=await response.json();if(!response.ok)throw Error(d.detail||'CSV import failed');stagedUploads.chart=null;await load(true);s.page='charts';render();notify('Imported '+d.bars+' candles for '+d.symbol+' '+d.interval+'; last bar '+fmt(d.last_time));}catch(err){notify(err.message)}finally{s.busy=false}return}if(e.target.id==='research-form'){e.preventDefault();const f=new FormData(e.target);s.researchQuestion=String(f.get('question')||'');try{s.busy=true;notify('Searching public headlines and analysing dated market context…');s.research=await api('/api/ai/research','POST',{question:s.researchQuestion});render();notify('Research response ready — review source dates and uncertainty')}catch(err){notify(err.message)}finally{s.busy=false}return}if(e.target.id!=='evidence-form')return;e.preventDefault();let f=new FormData(e.target);try{let b={title:f.get('title'),detail:f.get('detail'),source_url:f.get('source_url'),category:f.get('category'),impacts:f.get('manual_score_override')?{rates:Number(f.get('impact_rates')),haven:Number(f.get('impact_haven')),growth:Number(f.get('impact_growth'))}:{}};let r=await api('/api/events','POST',b);s.modal=null;s.mode='manual';s.page='stream';s.replay=null;await load();s.selected=r.id;render();notify('Evidence saved to your research workspace')}catch(err){notify(err.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(s.modal||s.connection))closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-event],[data-which]')){e.preventDefault();e.target.click()}});
setInterval(()=>{if(s.mode==='live'&&!s.modal&&!s.connection&&!document.querySelector('input[type=file]'))load(true)},30_000);
window.addEventListener('focus',()=>{if(!s.busy&&!document.querySelector('input[type=file]'))load(true)});
load();
</script>
</body></html>
